name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The conda environment ships no compiler, so every job builds with the runner's
# system toolchain against the conda Arrow, as a local build does.
defaults:
  run:
    shell: bash -el {0}

jobs:
  build:
    name: ${{ matrix.preset }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [release, asan, tsan]
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      # ThreadSanitizer refuses to start under the 32-bit mmap randomisation
      # recent Ubuntu kernels default to ("unexpected memory mapping").
      - name: Lower ASLR entropy for ThreadSanitizer
        if: matrix.preset == 'tsan' && runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --preset ${{ matrix.preset }} -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

  # MSVC, against the conda-forge Arrow for win-64. The Visual Studio generator is
  # multi-config, so the preset names the configuration at build and test time
  # rather than through CMAKE_BUILD_TYPE; conda puts every library under
  # Library/, which is what the preset's prefix path points at. cmd rather than
  # bash so that CONDA_PREFIX reaches CMake as a Windows path. The build preset
  # names its targets so that the build never enters the RUN_TESTS project
  # enable_testing() defines, which runs ctest and so would test the tree from
  # inside the build that is meant to produce it. Those names are CMake target
  # names, not file names: MSBuild matches them against the generated project
  # files, which are case-insensitive here, so a target called run_tests would
  # select RUN_TESTS.
  windows:
    name: msvc on windows-latest
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd /C call {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: cmd.exe
          cache-environment: true

      - name: Configure
        run: cmake --preset windows

      - name: Build
        run: cmake --build --preset windows -j %NUMBER_OF_PROCESSORS%

      - name: Test
        run: ctest --preset windows -j %NUMBER_OF_PROCESSORS%

      - name: Install the package
        run: >-
          pip install -e . --no-build-isolation
          -Ccmake.define.CMAKE_PREFIX_PATH=%CONDA_PREFIX%/Library

      - name: Test the package
        run: python -m pytest python/tests

  python:
    name: python on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install the package
        run: >-
          pip install -e . --no-build-isolation
          -Ccmake.define.CMAKE_PREFIX_PATH="$CONDA_PREFIX"

      - name: Test
        run: python -m pytest python/tests

  # The wheel's configuration: no conda, no Arrow, the one header-only
  # dependency fetched. The library and the command line build, and the Python
  # package passes its suite with PyPI's pandas and pyarrow, reading and writing
  # parquet through them.
  no-arrow:
    name: without Arrow on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure and build the command line
        run: |
          cmake -S . -B build-noarrow -DCPPLINK_WITH_ARROW=OFF
          cmake --build build-noarrow -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          ./build-noarrow/cpplink --version

      - name: Install the package
        run: pip install . -Ccmake.define.CPPLINK_WITH_ARROW=OFF

      - name: Test
        run: |
          pip install pytest pandas pyarrow
          cd "$RUNNER_TEMP" && python -m pytest "$GITHUB_WORKSPACE/python/tests"

  lint:
    name: format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: clang-format
        run: >-
          clang-format --dry-run --Werror
          src/main.cpp src/cpplink/* tests/*.cpp tests/*.hpp python/bindings/*

      - name: cpplint
        run: cpplint --recursive src tests python/bindings

      - name: ruff
        run: |
          ruff check .
          ruff format --check .
