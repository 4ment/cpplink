name: cpplink
channels:
  - conda-forge
dependencies:
  - clang-tools
  - cmake >= 3.15
  - cpplint
  - gtest
  - libarrow
  - libparquet
  - nlohmann_json
  - mkdocs-material
  - ninja
  # The Python package: pybind11 builds the extension, scikit-build-core drives
  # CMake from pip, and pyarrow is the same libarrow the extension links.
  - python
  - pip
  - pybind11
  - scikit-build-core
  - pyarrow
  - numpy
  - pytest
