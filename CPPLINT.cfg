linelength=90
# build/c++11: the project is C++17, so <chrono> and friends are fine.
# build/include_order: cpplint reads any <foo.h> as a C system header, so third-party
#   headers (<arrow/api.h>, <gtest/gtest.h>) can never satisfy it without contradicting
#   Google style. .clang-format is the authority on include order instead.
filter=-whitespace/indent,-runtime/references,-build/c++11,-build/include_order
