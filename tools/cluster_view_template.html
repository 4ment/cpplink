<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cpplink clusters</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fbfaf8;
  --panel: #ffffff;
  --ink: #1b1a18;
  --muted: #6d6a64;
  --line: #e3e0da;
  --line-soft: #efece6;
  --accent: #2f6f5e;
  --accent-soft: #e6f1ed;
  --warn: #9a5a12;
  --warn-soft: #fdf1e0;
  --bad: #a03232;
  --bad-soft: #fbeaea;
  --sel: #eef3f1;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16161a;
    --panel: #1d1e22;
    --ink: #e8e6e1;
    --muted: #9a978f;
    --line: #33343a;
    --line-soft: #26272c;
    --accent: #6fbfa5;
    --accent-soft: #1e2f2a;
    --warn: #d99a4e;
    --warn-soft: #33281a;
    --bad: #e0827e;
    --bad-soft: #34211f;
    --sel: #24262b;
  }
}
:root[data-theme="dark"] {
  --bg: #16161a;
  --panel: #1d1e22;
  --ink: #e8e6e1;
  --muted: #9a978f;
  --line: #33343a;
  --line-soft: #26272c;
  --accent: #6fbfa5;
  --accent-soft: #1e2f2a;
  --warn: #d99a4e;
  --warn-soft: #33281a;
  --bad: #e0827e;
  --bad-soft: #34211f;
  --sel: #24262b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  flex: 0 0 auto;
}
header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
header .meta { color: var(--muted); font-size: 12px; }
header .meta b { font-weight: 600; color: var(--ink); }
header .spacer { flex: 1; }
button.ghost {
  font: inherit; font-size: 12px; color: var(--muted); background: none;
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer;
}
button.ghost:hover { color: var(--ink); border-color: var(--muted); }
main { flex: 1; display: flex; min-height: 0; }
#side {
  width: 320px; flex: 0 0 320px; border-right: 1px solid var(--line);
  background: var(--panel); display: flex; flex-direction: column; min-height: 0;
}
.controls { padding: 10px; border-bottom: 1px solid var(--line-soft); display: grid; gap: 8px; }
.controls input, .controls select {
  font: inherit; font-size: 13px; width: 100%; padding: 5px 8px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
}
.controls .row { display: flex; gap: 8px; align-items: center; }
.controls label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
#list { overflow-y: auto; flex: 1; }
.item {
  padding: 8px 10px; border-bottom: 1px solid var(--line-soft); cursor: pointer;
  display: flex; gap: 8px; align-items: baseline;
}
.item:hover { background: var(--sel); }
.item.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item.more { justify-content: center; color: var(--muted); font-size: 12px; }
.item.more .cid { flex: none; }
.item .cid { font-family: var(--mono); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sz { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill {
  font-size: 10px; padding: 1px 5px; border-radius: 999px; white-space: nowrap;
  background: var(--warn-soft); color: var(--warn);
}
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
#detail { flex: 1; overflow: auto; padding: 16px 20px 60px; min-width: 0; }
#detail h2 { font-family: var(--mono); font-size: 15px; font-weight: 600; margin: 0 0 2px; }
.sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
.section { margin-bottom: 22px; }
.section > h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
  margin: 0 0 8px; font-weight: 600;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; background: var(--panel);
  font-size: 12px; display: flex; gap: 7px; align-items: baseline;
}
.chip .k { color: var(--muted); font-size: 11px; }
.chip .v { font-family: var(--mono); }
.chip.agree { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--accent-soft); }
.chip.split .v { color: var(--warn); }
.chip.empty { opacity: 0.55; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
th {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
  font-weight: 600; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line);
}
th .dcount { font-weight: 400; text-transform: none; letter-spacing: 0; }
tr:last-child td { border-bottom: none; }
td.id { font-family: var(--mono); font-size: 12px; }
td.val { font-family: var(--mono); font-size: 12px; }
td.odd { background: var(--warn-soft); color: var(--warn); }
td.miss { color: var(--muted); opacity: 0.6; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
.truth { font-size: 10px; padding: 1px 5px; border-radius: 4px; font-family: var(--mono); }
.matrix { font-size: 12px; }
.matrix td, .matrix th { text-align: right; font-variant-numeric: tabular-nums; padding: 4px 8px; }
.matrix td.none { color: var(--muted); opacity: 0.45; }
.matrix td.weak { background: var(--warn-soft); color: var(--warn); }
.matrix th.rowhead { text-align: left; font-family: var(--mono); text-transform: none; letter-spacing: 0; }
.empty-state { color: var(--muted); padding: 40px 0; text-align: center; }
kbd {
  font: inherit; font-size: 11px; font-family: var(--mono); border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted);
}
</style>
</head>
<body>
<header>
  <h1>cpplink clusters</h1>
  <span class="meta" id="hmeta"></span>
  <span class="spacer"></span>
  <span class="meta"><kbd>j</kbd> <kbd>k</kbd> move &middot; <kbd>/</kbd> search</span>
  <button class="ghost" id="theme">theme</button>
</header>
<main>
  <div id="side">
    <div class="controls">
      <input id="q" type="search" placeholder="search id or any value">
      <div class="row">
        <label for="sort">sort</label>
        <select id="sort">
          <option value="discord">most disagreement</option>
          <option value="size">size</option>
          <option value="weakest">weakest edge</option>
          <option value="id">id</option>
        </select>
      </div>
      <div class="row">
        <label for="only">show</label>
        <select id="only">
          <option value="all">every cluster</option>
          <option value="split">columns that disagree</option>
          <option value="transitive">transitive-only links</option>
          <option value="mixed">mixed against truth</option>
        </select>
      </div>
    </div>
    <div id="list"></div>
  </div>
  <div id="detail"><div class="empty-state">Pick a cluster.</div></div>
</main>
<script type="application/json" id="payload">__CLUSTER_DATA__</script>
<script>
// The payload is the whole dataset when this page was written by
// cluster_view.py, and the literal null when cluster_server.py served it. In
// that second case the same screens are filled from the API instead, so the
// page is one UI over either a sample small enough to embed or a database too
// large to.
const raw = document.getElementById('payload').textContent.trim();
const EMBEDDED = raw === '__CLUSTER' + '_DATA__' || raw === 'null' ? null : JSON.parse(raw);
const LIVE = EMBEDDED === null;
const PAGE = 100;  // list rows fetched at a time
const truthColors = ['#2f6f5e', '#8a5a2b', '#4a5d9c', '#8c3f6d', '#6b7a2f', '#a03232'];

let COLS = [];
let SOURCE = '';
let TOTALS = { clusters: 0, records: 0 };
let HAS_TRUTH = false;
let entries = [];        // the list, as far as it has been loaded
let matched = 0;         // clusters the current filter matches
let exhausted = false;
let current = null;
let details = new Map();
let token = 0;           // guards against a slow response for an old query

const $ = s => document.querySelector(s);
const esc = s => String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

async function api(path, params) {
    const url = new URL(path, location.href);
    for (const [k, v] of Object.entries(params || {})) url.searchParams.set(k, v);
    const answer = await fetch(url);
    if (!answer.ok) throw new Error(await answer.text());
    return answer.json();
}

// Per-column distinct values and the commonest one, over whatever rows are in
// hand. In live mode the server sends the counts over the whole cluster, since
// the rows are only the first page of a cluster that may be much larger.
function statsOf(rows, distinct) {
    return COLS.map((_, i) => {
        const seen = new Map();
        let missing = 0;
        for (const r of rows) {
            const v = r.v[i];
            if (v === null || v === '') { missing++; continue; }
            seen.set(v, (seen.get(v) || 0) + 1);
        }
        let top = null, best = 0;
        for (const [v, n] of seen) if (n > best) { best = n; top = v; }
        return { distinct: distinct ? distinct[i] : seen.size, missing, top };
    });
}

function summarise(cluster) {
    const n = cluster.rows.length;
    const stats = statsOf(cluster.rows, cluster.dist);
    const pairs = cluster.size * (cluster.size - 1) / 2;
    return {
        stats,
        agreeing: stats.filter(s => s.distinct === 1).length,
        gaps: stats.filter(s => s.distinct === 1 && s.missing > 0).length,
        transitive: Math.max(0, pairs - (cluster.edge_count ?? (cluster.edges || []).length)),
        shown: n,
    };
}

// Everything below reads `entries` and `details`; only these two fill them.
async function loadPage(reset) {
    if (reset) { entries = []; exhausted = false; matched = 0; }
    if (exhausted) return;
    const mine = ++token;
    const query = { q: $('#q').value.trim(), sort: $('#sort').value,
                    only: $('#only').value, offset: entries.length, limit: PAGE };
    if (LIVE) {
        const page = await api('/api/list', query);
        if (mine !== token) return;
        entries = entries.concat(page.clusters);
        matched = page.matched;
        exhausted = entries.length >= matched;
    } else {
        const all = EMBEDDED.clusters.filter(c => passes(c, query));
        matched = all.length;
        sortLocal(all, query.sort);
        entries = all.slice(0, entries.length + PAGE);
        exhausted = entries.length >= matched;
    }
}

function passes(c, query) {
    if (query.only === 'split' && !c.discord) return false;
    if (query.only === 'transitive' && !(c.size * (c.size - 1) / 2 > c.edge_count)) return false;
    if (query.only === 'mixed' && !(c.entities > 1)) return false;
    return !query.q || c.hay.includes(query.q.toLowerCase());
}

function sortLocal(list, sort) {
    const key = {
        discord: c => [-c.discord, -c.size],
        size: c => [-c.size, -c.discord],
        weakest: c => [c.weakest === null ? Infinity : c.weakest, -c.size],
        id: c => [c.id],
    }[sort];
    list.sort((a, b) => {
        const ka = key(a), kb = key(b);
        for (let i = 0; i < ka.length; i++) {
            if (ka[i] < kb[i]) return -1;
            if (ka[i] > kb[i]) return 1;
        }
        return 0;
    });
}

async function detail(id) {
    if (details.has(id)) return details.get(id);
    const entry = entries.find(c => c.id === id);
    const got = LIVE ? await api('/api/cluster', { id }) : entry;
    details.set(id, got);
    return got;
}

function renderList() {
    const list = $('#list');
    list.innerHTML = '';
    for (const c of entries) {
        const el = document.createElement('div');
        el.className = 'item' + (current && c.id === current.id ? ' on' : '');
        let pills = '';
        if (c.entities > 1) pills += `<span class="pill bad">${c.entities} entities</span>`;
        if (c.discord) pills += `<span class="pill">${c.discord} split</span>`;
        else pills += `<span class="pill ok">all agree</span>`;
        el.innerHTML = `<span class="cid">${esc(c.id)}</span>${pills}` +
            `<span class="sz">${c.size.toLocaleString()}</span>`;
        el.onclick = () => select(c.id);
        list.appendChild(el);
    }
    if (!exhausted) {
        const more = document.createElement('div');
        more.className = 'item more';
        more.innerHTML = `<span class="cid">${(matched - entries.length).toLocaleString()} more</span>`;
        more.onclick = async () => { await loadPage(false); renderList(); };
        list.appendChild(more);
    }
    $('#hmeta').innerHTML =
        `<b>${matched.toLocaleString()}</b> of <b>${TOTALS.clusters.toLocaleString()}</b> ` +
        `clusters &middot; ${TOTALS.records.toLocaleString()} records &middot; ${esc(SOURCE)}` +
        (LIVE ? ' &middot; <span style="color:var(--accent)">live</span>' : '');
}

async function rebuild(reset) {
    await loadPage(reset !== false);
    renderList();
    if (!current || !entries.some(c => c.id === current.id)) {
        await select(entries.length ? entries[0].id : null);
    }
}

async function select(id) {
    if (id === null) {
        current = null;
        $('#detail').innerHTML = '<div class="empty-state">Nothing matches.</div>';
        renderList();
        return;
    }
    current = { id };
    renderList();
    const d = $('#detail');
    d.innerHTML = '<div class="empty-state">Loading&hellip;</div>';
    const c = await detail(id);
    if (!current || current.id !== id) return;
    const view = summarise(c);

    let sub = `${c.size.toLocaleString()} records`;
    if (view.shown < c.size) sub += ` (showing ${view.shown})`;
    sub += ` &middot; ${view.agreeing} of ${COLS.length} columns agree wherever they are filled in`;
    if (view.gaps) sub += ` (${view.gaps} with gaps)`;
    if (c.weakest !== null && c.weakest !== undefined) {
        sub += ` &middot; weakest edge ${c.weakest.toFixed(1)} bits`;
    }
    if (view.transitive > 0) {
        sub += ` &middot; ${view.transitive.toLocaleString()} pair` +
            `${view.transitive === 1 ? '' : 's'} only linked transitively`;
    }
    if (c.entities > 1) {
        sub += ` &middot; <span style="color:var(--bad)">${c.entities} true entities merged</span>`;
    }

    const chips = COLS.map((name, i) => {
        const s = view.stats[i];
        if (s.distinct === 0) {
            return `<div class="chip empty"><span class="k">${esc(name)}</span>` +
                `<span class="v">all missing</span></div>`;
        }
        if (s.distinct === 1) {
            const miss = s.missing ? ` <span class="k">(${s.missing} missing)</span>` : '';
            return `<div class="chip agree"><span class="k">${esc(name)}</span>` +
                `<span class="v">${esc(s.top)}</span>${miss}</div>`;
        }
        return `<div class="chip split"><span class="k">${esc(name)}</span>` +
            `<span class="v">${s.distinct} values</span></div>`;
    }).join('');

    const truthy = c.rows.length && c.rows[0].t !== undefined;
    const head = ['<th>id</th>'].concat(truthy ? ['<th>truth</th>'] : [])
        .concat(COLS.map((name, i) => {
            const s = view.stats[i];
            const d = s.distinct > 1 ? ` <span class="dcount">(${s.distinct})</span>` : '';
            return `<th>${esc(name)}${d}</th>`;
        })).join('');

    const body = c.rows.map(r => {
        const cells = COLS.map((_, i) => {
            const s = view.stats[i], v = r.v[i];
            if (v === null || v === '') return '<td class="val miss">&mdash;</td>';
            const odd = s.distinct > 1 && v !== s.top;
            return `<td class="val${odd ? ' odd' : ''}">${esc(v)}</td>`;
        }).join('');
        const colour = truthColors[(r.t || 0) % truthColors.length];
        const t = truthy ? `<td><span class="truth" style="background:${colour}22;` +
            `color:${colour}">${r.t + 1}</span></td>` : '';
        return `<tr><td class="id">${esc(r.id)}</td>${t}${cells}</tr>`;
    }).join('');

    let matrix = '';
    if (c.edges && c.rows.length <= 40) {
        const at = new Map(c.rows.map((r, i) => [r.id, i]));
        const w = new Map();
        let lo = Infinity;
        for (const [a, b, x] of c.edges) {
            const i = at.get(a), j = at.get(b);
            if (i === undefined || j === undefined) continue;
            w.set(Math.min(i, j) + ':' + Math.max(i, j), x);
            lo = Math.min(lo, x);
        }
        const cells = i => c.rows.map((_, j) => {
            if (i === j) return '<td class="none">&middot;</td>';
            const x = w.get(Math.min(i, j) + ':' + Math.max(i, j));
            if (x === undefined) return '<td class="none">&mdash;</td>';
            return `<td class="${x === lo ? 'weak' : ''}">${x.toFixed(1)}</td>`;
        }).join('');
        matrix = `
      <div class="section">
        <h3>Edge weights, in bits &mdash; a dash is a pair the run never scored above the threshold</h3>
        <div class="tablewrap"><table class="matrix">
          <tr><th></th>${c.rows.map((_, j) => `<th>${j + 1}</th>`).join('')}</tr>
          ${c.rows.map((r, i) => `<tr><th class="rowhead">${i + 1}. ${esc(r.id)}</th>${cells(i)}</tr>`).join('')}
        </table></div>
      </div>`;
    }

    d.innerHTML = `
    <h2>${esc(c.id)}</h2>
    <div class="sub">${sub}</div>
    <div class="section"><h3>What they have in common</h3><div class="chips">${chips}</div></div>
    <div class="section"><h3>Records</h3><div class="tablewrap"><table>
      <thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>
    ${matrix}`;
    d.scrollTop = 0;
}

function move(step) {
    const i = entries.findIndex(c => current && c.id === current.id);
    const next = entries[Math.max(0, Math.min(entries.length - 1, i + step))];
    if (next) {
        select(next.id);
        $('#list').children[entries.indexOf(next)].scrollIntoView({ block: 'nearest' });
    }
}

document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
        if (e.key === 'Escape') e.target.blur();
        return;
    }
    if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});

let typing = null;
$('#q').addEventListener('input', () => {
    clearTimeout(typing);
    typing = setTimeout(() => rebuild(true), 200);
});
$('#sort').addEventListener('change', () => rebuild(true));
$('#only').addEventListener('change', () => rebuild(true));
$('#list').addEventListener('scroll', async e => {
    const el = e.target;
    if (exhausted || el.scrollTop + el.clientHeight < el.scrollHeight - 200) return;
    await loadPage(false);
    renderList();
});
$('#theme').onclick = () => {
    const now = document.documentElement.getAttribute('data-theme');
    const dark = now ? now === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};

(async function boot() {
    if (LIVE) {
        const summary = await api('/api/summary');
        COLS = summary.columns;
        SOURCE = summary.source;
        TOTALS = summary.totals;
        HAS_TRUTH = summary.has_truth;
    } else {
        COLS = EMBEDDED.columns;
        SOURCE = EMBEDDED.source;
        TOTALS = { clusters: EMBEDDED.totals.clusters, records: EMBEDDED.totals.records || 0 };
        for (const c of EMBEDDED.clusters) {
            const stats = statsOf(c.rows, null);
            c.size = c.size || c.rows.length + (c.more || 0);
            c.discord = stats.filter(s => s.distinct > 1).length;
            c.edge_count = (c.edges || []).length;
            c.weakest = c.edges && c.edges.length ? Math.min(...c.edges.map(e => e[2])) : null;
            c.entities = c.rows[0] && c.rows[0].t !== undefined
                ? new Set(c.rows.map(r => r.t)).size : 0;
            c.hay = (c.id + ' ' + c.rows.map(r => r.id + ' ' + r.v.join(' ')).join(' ')).toLowerCase();
            c.edges = (c.edges || []).map(([i, j, x]) => [c.rows[i].id, c.rows[j].id, x]);
        }
    }
    await rebuild(true);
})();
</script>
</body>
</html>
