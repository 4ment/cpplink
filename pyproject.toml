[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "cpplink"
dynamic = ["version"]
description = "Streaming Fellegi-Sunter record linkage, from Python"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Mathieu Fourment"}]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow"]

[project.optional-dependencies]
test = ["pytest"]
# `cpplink-viewer` serves the clusters of a run over a DuckDB cache.
viewer = ["duckdb"]

[project.scripts]
cpplink-viewer = "cpplink_viewer.server:main"

[project.urls]
Homepage = "https://github.com/4ment/cpplink"
Documentation = "https://4ment.github.io/cpplink/"

[tool.scikit-build]
# The version is CMake's project(cpplink VERSION ...), so there is one number.
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "CMakeLists.txt"
metadata.version.regex = 'project\(cpplink VERSION (?P<value>[0-9.]+)'
cmake.args = ["-DCPPLINK_BUILD_PYTHON=ON"]
cmake.build-type = "Release"
wheel.packages = ["python/cpplink", "python/cpplink_viewer"]
# Keep the extension's build out of build/, which is the CLI's.
build-dir = "build/python"

[tool.scikit-build.editable]
mode = "redirect"
rebuild = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
# The same column limit as the C++ side.
line-length = 90
target-version = "py310"
src = ["python"]
# Sources only: the build tree and the rendered site are not ours to lint, and
# the notebook and the code fences in the docs keep their own layout.
extend-exclude = ["build", "build-*", "site", "temp", "*.ipynb", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["cpplink", "cpplink_viewer"]
